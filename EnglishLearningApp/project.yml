# XcodeGen project definition.
# Install XcodeGen (brew install xcodegen) then run `xcodegen generate`
# in this directory to produce EnglishLearningApp.xcodeproj.
name: EnglishLearningApp
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "13.0"
  createIntermediateGroups: true
targets:
  EnglishLearningApp:
    type: application
    platform: iOS
    deploymentTarget: "13.0"
    sources:
      - Sources
    info:
      path: Resources/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.EnglishLearningApp
        SWIFT_VERSION: "5.0"
        INFOPLIST_FILE: Resources/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - sdk: AVFoundation.framework
      - sdk: Speech.framework
